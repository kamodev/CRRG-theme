# Publishes a GitHub release with the installable theme ZIP.
#
# - Push a version tag (for example v0.1.5) that matches the Version in
#   style.css, or
# - run it from the Actions tab ("Run workflow") on a branch: the tag
#   v<Version from style.css> is created on that commit.
#
# Running it again for an existing release replaces the ZIP and notes.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Work out the version and tag
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n 1 | tr -d '\r')
          if [ -z "${version}" ]; then
            echo "::error::No Version found in style.css"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "v${version}" != "${tag}" ]; then
              echo "::error::Tag ${tag} does not match Version ${version} in style.css"
              exit 1
            fi
          else
            tag="v${version}"
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Build the theme ZIP
        # .gitattributes keeps development files out of the archive.
        run: git archive --format=zip --prefix=crrg/ -o "crrg-${VERSION}.zip" HEAD

      - name: Write release notes from the readme.txt changelog
        run: |
          awk -v heading="= ${VERSION} =" '
            $0 == heading { found = 1; next }
            found && /^(= |== )/ { exit }
            found { print }
          ' readme.txt > notes.md
          printf '\n**Install:** download `crrg-%s.zip` below, then in WordPress go to Appearance > Themes > Add New Theme > Upload Theme.\n' "${VERSION}" >> notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "crrg-${VERSION}.zip" --clobber
            gh release edit "${TAG}" --notes-file notes.md
          else
            # Creates the tag on this commit when it does not exist yet.
            gh release create "${TAG}" "crrg-${VERSION}.zip" \
              --target "${GITHUB_SHA}" \
              --title "CRRG ${TAG}" \
              --notes-file notes.md
          fi
